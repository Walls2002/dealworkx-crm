const $=id=>document.getElementById(id);let workspace=null,page='console',busy=false,selected=new Set(),leadFilters={q:'',status:'*',country:'*',zone:'*'},pipeline=[];
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function note(t){$('notice').textContent=t;}
function action(fn){return async()=>{if(busy)return;try{await fn();}catch(e){note(e.message||String(e));}};}
function button(text,fn,cls){const b=el('button',text,cls);b.onclick=action(fn);return b;}

function blank(v){return !String(v||'').trim()||String(v).trim().toLowerCase()==='unassigned';}
function select(label,values,value,onchange){const l=el('label',label),s=el('select');values.forEach(([v,t])=>s.add(new Option(t,v)));s.value=value;s.onchange=()=>onchange(s.value);l.append(s);return l;}

async function loadWorkspace(){

}
async function init(){

    workspace=null;

    currentId=null;

    $('identity').textContent='Workspace unavailable';

function capacityCard(owner){

  if(!c){box.textContent='Choose a sequence owner to see daily capacity.';return box;}

function assignmentControls(getIds,onSaved,label){

  pain.input.options[0].text='Choose a Step 1 pain point';
  const cap=el('div');
  const assign=button(label,async()=>{
    const ids=getIds();
    if(!ids.length||!owner.input.value||!pain.input.value)return;
    if(!confirm('Assign '+ids.length+' lead(s) to '+owner.input.value+'? This applies the selected pain point, starts Step 1 with Email + LinkedIn, and sets the activation date to today.'))return;

  owner.input.onchange=update;pain.input.onchange=update;
  row.append(owner.label,pain.label,assign);root.append(row,cap);update();
  return {root,update};
}
let updateLeadAssignment=()=>{};
const leadPageSize=75;
let leadPage=0;
function drawLeads(){
  const root=$('page');root.replaceChildren(el('h2','Unassigned Lead List'));
  const filters=el('div',undefined,'filters'),label=el('label','Find a lead'),q=el('input');
  q.placeholder='Name, ID, company or email';q.value=leadFilters.q;label.append(q);filters.append(label);
  q.oninput=()=>{leadFilters.q=q.value;selected.clear();leadPage=0;drawLeadTable();};

    const values=[['*',k==='status'?'All statuses':k==='country'?'All countries':'All timezones']];

    filters.append(select(k==='zone'?'Timezone':k[0].toUpperCase()+k.slice(1),values,leadFilters[k],v=>{leadFilters[k]=v;selected.clear();leadPage=0;drawLeadTable();}));

    const controls=assignmentControls(()=>[...selected],async result=>{await init();note(result.assigned+' leads assigned and activated.');},'Assign selected leads');
    updateLeadAssignment=controls.update;root.append(controls.root);
  }else{updateLeadAssignment=()=>{};root.append(capacityCard(workspace.user.owner));}
  const list=el('div',undefined,'panel');list.id='leadTable';root.append(list);drawLeadTable();
  const d=workspace.diagnostic;
  if(d&&(d.missing||d.duplicates||!workspace.items.length))note('Workbook: '+d.sheetName+'. '+d.missing+' populated rows have no Prospect ID; '+d.duplicates+' rows have duplicate IDs. Check PROSPECT LIST column BN.');

}
function drawLeadTable(){
  const rows=filtered(),root=$('leadTable');
  const pageCount=Math.max(1,Math.ceil(rows.length/leadPageSize));
  leadPage=Math.min(leadPage,pageCount-1);
  const first=leadPage*leadPageSize,last=Math.min(first+leadPageSize,rows.length);
  const summary=()=>rows.length+' matching leads · '+selected.size+' selected';
  const count=el('p',summary());root.replaceChildren(count);
  if(pageCount>1){
    const controls=el('div',undefined,'actions');
    const previous=button('Previous',()=>{leadPage--;drawLeadTable();},'secondary');
    const next=button('Next page',()=>{leadPage++;drawLeadTable();},'secondary');
    previous.disabled=leadPage===0;next.disabled=leadPage===pageCount-1;

    const cells=[p.id,p.name,p.company,p.status,p.step,p.country,p.zone,button('Open',()=>openLead(p.id),'secondary')];
    if(workspace.user.admin){
      const cb=el('input');cb.type='checkbox';cb.checked=selected.has(p.id);cb.setAttribute('aria-label','Select '+p.id);
      cb.onchange=()=>{if(cb.checked){if(selected.size>=50){cb.checked=false;note('Assign at most 50 leads at a time.');return;}selected.add(p.id);}else selected.delete(p.id);count.textContent=summary();updateLeadAssignment();};
      cells.unshift(cb);
    }
    return cells;
  })));
  updateLeadAssignment();
}
function drawPipeline(){const root=$('page');root.replaceChildren(el('h2','Call Pipeline'),el('p','Live records from CALL PIPELINE, limited to leads you are permitted to see.','muted'));const filters=el('div',undefined,'filters'),q=el('input');q.placeholder='Search calls';q.setAttribute('aria-label','Search call pipeline');const box=el('div',undefined,'panel');let disposition='*';function draw(){const query=q.value.toLowerCase(),rows=pipeline.filter(r=>(disposition==='*'||r.disposition===disposition)&&[r.id,r.name,r.company,r.notes,r.owner].join(' ').toLowerCase().includes(query));box.replaceChildren(table(['Call date','Prospect','Name','Owner','Disposition','Callback','Phone','Notes'],rows.map(r=>[r.date,r.id,r.name,r.owner,r.disposition,r.callback,r.phone,el('span',r.notes)])));}q.oninput=draw;filters.append(q,select('Disposition',[['*','All dispositions'],...[...new Set(pipeline.map(r=>r.disposition))].sort().map(v=>[v,v])],'*',v=>{disposition=v;draw();}));root.append(filters,box);draw();note(pipeline.length+' accessible call records.');}
function drawDashboard(d){const root=$('page');root.replaceChildren(el('h2','Daily Dashboard'),el('p',d.today+' · '+d.zone+' · Totals cover only the leads you can access.','muted'));const cards=el('div',undefined,'cards');for(const [key,title]of [['visible','Visible leads'],['unassigned','Unassigned'],['active','Active leads'],['dueToday','Due today'],['overdue','Overdue'],['callsToday','Calls today']]){const c=el('div',title,'card');c.append(el('strong',d.cards[key]));cards.append(c);}root.append(cards);if(d.sheetSummary){const p=el('div',undefined,'panel');p.append(el('h3','Workbook summary — DAILY DASHBOARD'));p.append(table(d.sheetSummary[0].filter((_,i)=>i%2===0),[d.sheetSummary[1].filter((_,i)=>i%2===0)]));root.append(p);}const calls=el('div',undefined,'panel');calls.append(el('h3','Today’s call dispositions'),table(['Disposition','Calls'],Object.entries(d.dispositions)));root.append(calls);const queue=el('div',undefined,'panel');queue.append(el('h3','Due and overdue leads'),table(['ID','Name','Owner','Step','Due','Status',''],d.queue.map(r=>[r.id,r.name,r.owner,r.step,r.due,r.task,button('Open',()=>openLead(r.id),'secondary')])));root.append(queue);note('Dashboard refreshed.');}
let consoleFilters={status:'*',owner:'*',zone:'*',q:''},currentId=null,currentRecord=null,messageMode='JOB-TITLE ALIGNED',previewDate='',dirty=false;
function queueMatches(p,f,today){
  const task=String(p.task||'').trim().toLowerCase();
  const status=f.status==='*'||(f.status==='Assigned'&&!blank(p.owner))||(f.status==='Due'&&['due','due today'].includes(task))||(f.status==='Overdue'&&task==='overdue')||(f.status==='Newly assigned'&&!blank(p.owner)&&p.assignmentDay===today)||(f.status==='UNASSIGNED'&&blank(p.owner))||f.status==='task:'+task;
  return status&&(f.owner==='*'||p.owner===f.owner)&&(f.zone==='*'||p.zone===f.zone)&&[p.name,p.company,p.id,p.email].join(' ').toLowerCase().includes(f.q.toLowerCase());
}
function queue(){return workspace.items.filter(p=>queueMatches(p,consoleFilters,workspace.today));}
function discard(){if(!dirty)return true;if(confirm('Leave this lead and discard unsaved form changes?')){dirty=false;return true;}return false;}
function watch(input){input.addEventListener('input',()=>dirty=true);input.addEventListener('change',()=>dirty=true);return input;}
function textInput(label,type='text',value=''){const l=el('label',label),i=el('input');i.type=type;i.value=value;l.append(i);return {label:l,input:i};}
function choice(label,values,value){const l=el('label',label),s=el('select');values.forEach(v=>s.add(new Option(v,v)));s.value=values.includes(value)?value:values[0];l.append(s);return {label:l,input:s};}
function websiteUrl(value){const url=String(value||'').trim();if(!url)return '';if(/^https?:\/\//i.test(url))return url;if(/^\/\//.test(url))return 'https:'+url;if(/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(?:[/:?#]|$)/i.test(url))return 'https://'+url;return '';}
function phoneLink(label,value){
  const display=String(value||'').trim(),match=display.match(/^(\+?[\d .()\-]+?)(?:\s*(?:ext\.?|x|#)\s*(\d+))?$/i);

  if(!/^\+?\d{7,15}$/.test(dial))return el('span',label+': '+display);

  const chip=el('span',undefined,'phoneChip');chip.append(el('small',label),a);return chip;
}
function safeLink(label,url){try{const u=new URL(url);if(!['https:','http:','mailto:','tel:'].includes(u.protocol))return el('span',label);const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch(_){return el('span',label);}}
function drawConsole(){
  const root=$('page');root.replaceChildren();const filters=el('div',undefined,'filters');
  const statuses=[['*','All tasks'],...['Assigned','Due','Overdue','Newly assigned','UNASSIGNED'].map(v=>[v,v]),...[...new Set(workspace.items.map(p=>String(p.task||'').trim().toLowerCase()).filter(Boolean))].filter(v=>!['due','due today','overdue'].includes(v)).map(v=>['task:'+v,v.toUpperCase()])];

  filters.append(select('Task status',statuses,consoleFilters.status,v=>onFilter('status',v)),select('Owner',[['*','All accessible owners'],...[...new Set(workspace.items.map(p=>p.owner).filter(v=>!blank(v)))].sort().map(v=>[v,v])],consoleFilters.owner,v=>onFilter('owner',v)),select('Timezone',[['*','All timezones'],...[...new Set(workspace.items.map(p=>p.zone).filter(Boolean))].sort().map(v=>[v,v])],consoleFilters.zone,v=>onFilter('zone',v)));

  const d=workspace.diagnostic;if(d&&(d.missing||d.duplicates||!workspace.items.length))note('Workbook: '+d.sheetName+'. '+d.missing+' populated rows have no Prospect ID; '+d.duplicates+' rows have duplicate IDs. Check PROSPECT LIST column BN.');else note('Ready.');
}
async function nextLead(){if(!discard())return;workspace=await loadWorkspace();const items=queue(),index=items.findIndex(p=>p.id===currentId);if(!items.length){currentId=null;currentRecord=null;drawConsole();note('No leads match this task status.');return;}if(index===items.length-1){drawConsole();note('End of this queue. Choose another status or select a lead to restart.');return;}await openLead(items[index+1].id);}
async function openLead(id){if(!discard())return;note('Loading prospect details and messages…');const r=await rpc('getProspect',id,messageMode,previewDate);currentId=id;currentRecord=r;page='console';document.querySelectorAll('[data-page]').forEach(b=>b.className=b.dataset.page===page?'':'secondary');if(!queue().some(p=>p.id===id))consoleFilters={status:'*',owner:'*',zone:'*',q:''};drawConsole();note('Loaded '+r.id+'.');}
async function afterSave(id){dirty=false;workspace=await loadWorkspace();await openLead(id);}
let clockTimer;
function prospectClock(zone){
  clearInterval(clockTimer);
  const clock=el('div',undefined,'detailField prospectClock');
  const value=el('strong');clock.append(el('small','Prospect local time'),value);
  let formatter;
  try{
    if(!zone)throw Error('Missing time zone');
    formatter=new Intl.DateTimeFormat(undefined,{timeZone:zone,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'});
  }catch(_){value.textContent='Unavailable · check the prospect time zone';return clock;}
  const update=()=>{value.textContent=formatter.format(new Date());};
  update();clock.append(el('small',zone));
  clockTimer=setInterval(()=>{if(clock.isConnected)update();else clearInterval(clockTimer);},1000);

function gmailCompose(email){
  const address=String(email||'').trim();
  if(!/^[^\s,@;<>]+@[^\s,@;<>]+\.[^\s,@;<>]+$/.test(address))return null;
  const url=new URL('https://mail.google.com/mail/');
  url.search=new URLSearchParams({view:'cm',fs:'1',to:address}).toString();
  return url.href;
}

  note('Loading full prospect record…');
  const fields=await rpc('getProspectFields',r.id);
  $('detailBody').replaceChildren(el('h2','Prospect fields · '+r.id),table(['Field','Value'],fields.map(f=>[f.label,f.value])));

function renderRecord(r,body){
  body.replaceChildren(el('h2',r.name),el('p',r.id+' · '+(r.owner||'UNASSIGNED')),el('p',r.step+' · '+r.task,'badge'));
  const links=el('div',undefined,'actions');for(const [label,url]of [['LinkedIn profile',r.profiles.linkedin],['Company website',r.profiles.website],['Company LinkedIn',r.profiles.companyLinkedin]])if(websiteUrl(url)){const a=safeLink(label,websiteUrl(url));a.className='linkChip';links.append(a);}const gmail=gmailCompose(r.email);if(gmail){const a=safeLink('Email prospect in Gmail',gmail);a.className='linkChip';links.append(a);}links.append(button('View all 65 prospect fields',()=>showProspectFields(r),'secondary'));body.append(links);
  const details=el('div',undefined,'detailsGrid');
  details.append(prospectClock(r.zone));
  const profile=[['Company name',r.company],['Email status',r.contact?.emailStatus],['Number of employees',r.contact?.employees],['Contact state',r.contact?.state],['Contact country',r.country]];
  for(const [label,value] of profile){
    const detail=el('div',undefined,'detailField');detail.append(el('small',label),el('strong',value||'—'));details.append(detail);
  }
  const keyFields=new Set(['job title','industry','lead status','primary pain (step 1)']);
  const shown=new Set();
  for(const field of r.fields){
    const label=field.label.trim().toLowerCase();
    if(!field.value||!keyFields.has(label)||shown.has(label))continue;
    shown.add(label);
    const detail=el('div',undefined,'detailField');detail.append(el('small',field.label),el('strong',field.value));details.append(detail);
  }
  body.append(details,callPanel(r));
  if(workspace.user.admin&&blank(r.owner))body.append(assignmentControls(()=>[r.id],()=>afterSave(r.id),'Assign this lead').root);
  if(r.canComplete){const settings=el('details'),f=el('div',undefined,'filters');settings.append(el('summary','Edit lead status, disposition and channel plan'));const status=choice('Lead status',['Inactive','Active','Paused','Bad'],r.status),disp=choice('Sequence disposition',['None','Bounced','Requested to unsubscribe','Replied','Meeting booked'],r.disposition),plan=choice('Step 1 channels',['Email + LinkedIn','Email only'],r.channelPlan);[status,disp,plan].forEach(x=>{watch(x.input);f.append(x.label);});f.append(button('Save lead settings',async()=>{await rpc('saveLeadSettings',r.id,{status:status.input.value,disposition:disp.input.value,channelPlan:plan.input.value});await afterSave(r.id);}));settings.append(f);body.append(settings);}
  const outreach=el('section',undefined,'panel');
  outreach.append(el('h3','Current step outreach'),button('Check current step',()=>openLead(r.id),'secondary'));
  const options=el('details'),preview=el('div',undefined,'filters');
  const mode=choice('Messaging mode',['JOB-TITLE ALIGNED','GENERAL'],messageMode),date=textInput('Preview as-of date','date',previewDate||workspace.today);
  preview.append(mode.label,date.label,button('Update preview',async()=>{if(!discard())return;messageMode=mode.input.value;previewDate=date.input.value;await openLead(r.id);}));
  options.append(el('summary','Message options'),preview);outreach.append(options);
  if(!r.messages.length)outreach.append(el('p','No pending message for the current step.','muted'));
  for(const m of r.messages){
    const card=el('div',undefined,'message currentStep');
    card.append(el('h3',m.step+' · '+m.channel));
    if(!m.ready){card.append(el('p',m.reason+(m.eligible?' · Eligible: '+m.eligible:''),'muted'));outreach.append(card);continue;}
    if(m.subject)card.append(el('p','Subject: '+m.subject));
    const t=el('textarea');t.value=m.body;t.readOnly=true;t.setAttribute('aria-label',m.channel+' message');card.append(t);
    const actions=el('div',undefined,'actions');
    function copy(value){return async()=>{try{await navigator.clipboard.writeText(value);note('Copied.');}catch(_){t.value=value;t.focus();t.select();note('Press Ctrl+C to copy.');}};}
    if(m.subject)actions.append(button('Copy subject',copy(m.subject),'secondary'));
    actions.append(button('Copy message',copy(m.body)));
    if(r.canComplete)actions.append(button('Mark complete',async()=>{
      if(!confirm('Confirm '+m.step+' '+m.channel+' was sent to '+r.id+'?'))return;
      await rpc('markComplete',r.id,m.index);await afterSave(r.id);
    },'secondary'));
    card.append(actions);outreach.append(card);
  }
  if(r.completed?.length){
    const history=el('details');history.append(el('summary','Completed steps'));
    for(const item of r.completed){
      const row=el('div',undefined,'actions');row.append(el('span',item.step+' · '+item.channel));
      if(r.canComplete)row.append(button('Reset to pending',async()=>{
        if(!confirm('Reset this channel to pending and clear its completion date?'))return;
        await rpc('markComplete',r.id,item.index,'PENDING');await afterSave(r.id);
      },'secondary'));
      history.append(row);
    }
    outreach.append(history);
  }
  body.append(outreach);
  const comments=el('section',undefined,'panel');comments.id='savedComments';comments.append(el('h3','Comments'));if(r.canComplete){const t=el('textarea');t.placeholder='Add a follow-up note…';t.maxLength=4000;t.setAttribute('aria-label','New comment');watch(t);comments.append(t,button('Save comment',async()=>{await rpc('addComment',r.id,t.value);await afterSave(r.id);}));}else comments.append(el('p','Assign this lead before adding comments.','muted'));r.comments.forEach(c=>{const item=el('div',undefined,'comment');item.append(el('small',c.date+' · '+c.author),el('p',c.text));comments.append(item);});if(!r.comments.length)comments.append(el('p','No comments yet.','muted'));body.append(comments);
}
function callPanel(r){
  const calls=el('section',undefined,'panel'),phoneNumbers=r.phones.filter(p=>String(p.number||'').trim());
  calls.append(el('h3','Call this prospect'));
  const phones=el('div',undefined,'actions');
  for(const phone of phoneNumbers)phones.append(phoneLink(phone.label,phone.number));
  if(phoneNumbers.length)calls.append(phones);
  else calls.append(el('p','No phone numbers on this record.','muted'));
  if(r.canComplete&&phoneNumbers.length){
    const form=el('div',undefined,'filters');
    const phone=choice('Number called',phoneNumbers.map(p=>p.label),''),disposition=choice('Call outcome',r.dispositions,''),callback=textInput('Callback date (optional)','date');
    const notesLabel=el('label','Call notes','callNotesLabel'),notes=el('textarea',undefined,'callNotes');
    notes.placeholder='Add a short call note';notes.maxLength=4000;notes.rows=2;notesLabel.append(notes);
    [phone.input,disposition.input,callback.input,notes].forEach(watch);
    form.append(phone.label,disposition.label,callback.label);
    calls.append(form,notesLabel,button('Save call',async()=>{
      if(!confirm('Save this call attempt for '+r.id+'?'))return;
      await rpc('saveCall',r.id,{phoneType:phone.input.value,disposition:disposition.input.value,callback:callback.input.value,notes:notes.value});
      await afterSave(r.id);
    }));
  }
  calls.append(button('View recorded call history',()=>openRecordedCalls(r.id),'secondary'));
  return calls;
}
let historyProspectId='';
async function openRecordedCalls(id=''){
  if(!discard())return;
  historyProspectId=id;await show('history');
}
async function drawRecordedCalls(){
  note('Loading recorded calls…');
  const records=await rpc('getRecordedCalls',historyProspectId);
  const root=$('page');root.replaceChildren(el('h2','Recorded Call History'));
  const filters=el('div',undefined,'filters'),search=textInput('Search call records','search');
  search.input.placeholder='Prospect, phone, outcome or notes';filters.append(search.label);
  if(historyProspectId){
    filters.append(button('Show all recorded calls',()=>openRecordedCalls(),'secondary'));
    root.append(el('p','Showing calls for '+historyProspectId,'badge'));
  }
  const box=el('div',undefined,'panel');root.append(filters,box);
  let offset=0;const size=75;
  function draw(){
    const term=search.input.value.trim().toLowerCase();
    const matches=records.filter(r=>[r.id,r.name,r.company,r.owner,r.phone,r.disposition,r.notes].join(' ').toLowerCase().includes(term));
    const end=Math.min(offset+size,matches.length),controls=el('div',undefined,'actions');
    const prev=button('Previous',()=>{offset-=size;draw();},'secondary'),next=button('Next page',()=>{offset+=size;draw();},'secondary');
    prev.disabled=offset===0;next.disabled=end>=matches.length;
    if(matches.length>size)controls.append(prev,el('span',(offset+1)+'–'+end+' of '+matches.length),next);
    box.replaceChildren(el('p',matches.length+' recorded calls'),controls,table(['Date','Prospect ID','Name','Owner','Phone','Outcome','Callback','Notes'],matches.slice(offset,end).map(r=>[r.date,r.id,r.name,r.owner,r.phone,r.disposition,r.callback,r.notes])));
  }
  search.input.oninput=()=>{offset=0;draw();};draw();note('');
}
async function drawFollowups(kind){note('Loading follow-up leads…');const rows=await rpc('getFollowups',kind),root=$('page'),title=kind==='interested'?'Interested Leads':'Email Requested';root.replaceChildren(el('h2',title),el('p','Based on each prospect’s latest recorded call outcome. Open a lead to view or add saved comments.','muted'));const filter=textInput('Search leads','search'),box=el('div',undefined,'panel');root.append(filter.label,box);function draw(){const q=filter.input.value.toLowerCase();box.replaceChildren(table(['ID','Name','Company','Owner','Last call','Callback','Call notes',''],rows.filter(p=>[p.id,p.name,p.company,p.owner,p.call.notes].join(' ').toLowerCase().includes(q)).map(p=>[p.id,p.name,p.company,p.owner,p.call.date,p.call.callback,p.call.notes,button('Open & comment',async()=>{await openLead(p.id);if(currentId===p.id)$('savedComments').scrollIntoView({behavior:'smooth'});},'secondary')])));}filter.input.oninput=draw;draw();note(rows.length+' '+title.toLowerCase()+'.');}


$('close').onclick=()=>$('detail').close();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=action(()=>b.dataset.page==='history'?openRecordedCalls():show(b.dataset.page)));$('refresh').onclick=action(async()=>{if(!discard())return;currentRecord=null;await init();});if(typeof google!=='undefined'&&google.script)init().catch(e=>note(e.message));else note('Preview only. Install in Google Apps Script and configure approved user emails to connect.');
</script></body></html>
